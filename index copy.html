<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AIDeBias Toolkit — Design with AI, not by AI. A lightweight industrial design assistant for debiasing AI styling exploration.">
  <title>AIDeBias Toolkit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <!-- Splash Screen -->
  <div id="splash">
    <div class="splash__inner">
      <div class="splash__logo">
        <span class="splash__emoji">💡</span>
        <h1 class="splash__title">AIDeBias Toolkit</h1>
        <p class="splash__tagline">Design with AI, not by AI.</p>
      </div>
      <div class="splash__divider"></div>
      <p class="splash__reminder">
        Friendly reminder: this toolkit is not designed to speed up your workflow. It is here to help you <strong>think more clearly</strong> and <strong>collaborate with AI intentionally</strong> — on your own terms.
      </p>
      <button id="splash-confirm" class="splash__btn" type="button">
        <span>I understand — let's begin</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </div>
  </div>

  <div id="app">
    <nav id="navbar"></nav>
    <main id="app-main"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root"></div>
  <script src="js/bundle.js"></script>
</body>
</html>
